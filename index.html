<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Peg Game</title>

    <link rel="stylesheet" type="text/css" href="style.css">

    <script src="libraries/p5.min.js"></script>
    <script src="libraries/p5.sound.min.js"></script>
  </head>

  <body>
    <div id="ui">
      <div id="instructions">
        <div>"JUMP ALL BUT ONE GAMES"</div>
        <div>JUMP EACH TEE AND REMOVE IT</div>
        <div>LEAVE ONLY ONE– YOU'RE GENIUS</div>
        <div>LEAVE TWO AND YOU'RE PURTY SMART</div>
        <div>LEAVE THREE AND YOU'RE JUST PLAIN DUMB</div>
        <div>LEAVE FOUR OR MOR'N YOU'RE JUST PLAIN</div>
        <div>"EG-NO-RA-MOOSE</div>
      </div>

      <!-- Top numbered hole buttons removed; use bottom selector instead -->
    </div>

    <div id="bottom-controls" role="region" aria-label="Open hole selector">
      <select id="hole-select" aria-label="Select open hole">
        <!-- options populated by JS or fallback provided below -->
        <option value="1">Open hole 1</option>
        <option value="2">Open hole 2</option>
        <option value="3">Open hole 3</option>
        <option value="4">Open hole 4</option>
        <option value="5">Open hole 5</option>
        <option value="6">Open hole 6</option>
        <option value="7">Open hole 7</option>
        <option value="8">Open hole 8</option>
        <option value="9">Open hole 9</option>
        <option value="10">Open hole 10</option>
        <option value="11">Open hole 11</option>
        <option value="12">Open hole 12</option>
        <option value="13">Open hole 13</option>
        <option value="14">Open hole 14</option>
        <option value="15">Open hole 15</option>
      </select>
      <button id="hole-select-btn" class="hole-btn" type="button">Set Open Hole</button>
    </div>

    <script src="sketch.js"></script>
  </body>
</html>
